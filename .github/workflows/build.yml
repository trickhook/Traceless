name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;26.0.10792818" "cmake;3.22.1"

      - name: Build release module zip
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew :module:zipRelease --stacktrace 2>&1 | tee gradle-build.log

      - name: Show CMake / native errors on failure
        if: failure()
        run: |
          echo "===== C/C++ and CMake error lines ====="
          grep -nE 'C/C\+\+:|CMake Error|CMake Warning|Cannot find source file|No SOURCES|error:|fatal error' gradle-build.log | head -200 || true
          echo "===== context around first 'CMake Error' ====="
          grep -nB2 -A8 'CMake Error' gradle-build.log | head -160 || true
          echo "===== metadata_generation_stderr.txt (if present) ====="
          find module -name 'metadata_generation_stderr.txt' -print -exec cat {} \; || true

      - name: Upload native build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cxx-logs
          path: |
            gradle-build.log
            module/.cxx/**
            module/build/**/cxx/**
          if-no-files-found: ignore

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: traceless-module
          path: module/release/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: module/release/*.zip
